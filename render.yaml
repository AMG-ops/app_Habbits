databases:
  - name: habitude-db
    databaseName: habitude
    user: habitude
    plan: free
    # Must match the service below: Render's internal hostnames only resolve
    # between resources in the same region.
    region: frankfurt

services:
  # A single image serves both the API and the interface, so there is no
  # service-to-service call to resolve. Private networking is not available
  # on the free plan, which is why this is not split in two.
  - type: web
    name: habitude
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habitude-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
