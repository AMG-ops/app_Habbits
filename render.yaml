databases:
  - name: habitude-db
    databaseName: habitude
    user: habitude
    plan: free
    # Must match the services below: Render's internal hostnames only resolve
    # between resources in the same region.
    region: frankfurt

services:
  - type: web
    name: habitude-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: habitude-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: habitude-web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Private address of the API, resolved by Render at deploy time.
      - key: API_UPSTREAM
        fromService:
          name: habitude-api
          type: web
          property: hostport
